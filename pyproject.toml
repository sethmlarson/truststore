[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "truststore"
authors = [
  {name = "Seth Michael Larson", email = "sethmichaellarson@gmail.com"},
  {name = "David Glick", email = "david@glicksoftware.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version", "description"]
requires-python = ">= 3.10"

[project.urls]
Source = "https://github.com/sethmlarson/truststore"
Documentation = "https://truststore.readthedocs.io"

[dependency-groups]
deploy = [
  "build",
]
dev = [
  "aiohttp",
  "httpx",
  "nox",
  "pyopenssl",
  "pytest",
  "pytest-asyncio",
  "pytest-httpserver",
  "pytest-rerunfailures",
  "requests",
  "trustme",
  "urllib3",
]

[tool.nab]
mode = "universal"
default-groups = ["dev"]
decision-order = "stable"
uploaded-prior-to = "P7D" # Seven-day release cooldown.
dist-policy = "wheel-only"
build-policy = "never"

[tool.nab.matrix]
python = ">=3.10,<3.16"
platforms = [
  "linux_x86_64",
  {id = "macos_arm64", runs-on-macos = "14.0"},
  "windows_amd64",
]

# PyPy 3.11 uses pp73 on Linux and pp80 on macOS and Windows.
[[tool.nab.matrix.include]]
python = "==3.11"
implementations = ["pypy"]
platforms = [
  {id = "linux_x86_64", pypy-abi = "pp73"},
  {id = "macos_arm64", runs-on-macos = "14.0", pypy-abi = "pp80"},
  {id = "windows_amd64", pypy-abi = "pp80"},
]

# Add free-threaded CPython 3.15 on the shared platforms.
[[tool.nab.matrix.include]]
python = ">=3.15,<3.16"
implementations = ["cpython"]
free-threaded = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # See: aio-libs/aiohttp#7545
  "ignore:.*datetime.utcfromtimestamp().*:DeprecationWarning",
]
markers = [
  "internet: test requires Internet access"
]

[tool.flit.sdist]
include = ["docs", "tests"]

[tool.ruff.lint]
extend-select = [
    "YTT",
    "I",
    "UP",
]
